name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROTOC: /usr/bin/protoc
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev libfontconfig1-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Initialize Anki only
        run: git submodule update --init -- vendor/anki
      - name: Apply patches idempotently
        run: |
          cargo xtask setup
          cargo xtask setup
          git -C vendor/anki apply --reverse --check ../../patches/anki/0001-expose-progress.patch
      - name: Build
        run: python3 scripts/cargo-bounded.py build --workspace --all-features --locked
      - name: Test
        run: python3 scripts/cargo-bounded.py test --workspace --all-features --locked
      - name: Clippy
        run: python3 scripts/cargo-bounded.py clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build cache guard tests
        run: python3 scripts/test-cargo-bounded.py
      - name: License metadata gate
        run: |
          python3 scripts/test-license-check.py
          python3 scripts/check-licenses.py
      - name: Replay fixture path guards
        run: python3 scripts/test-study-replay.py
