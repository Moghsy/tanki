[package]
name = "tanki-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tanki"
path = "src/main.rs"

[dependencies]
tanki-core = { path = "../tanki-core" }
tanki-term = { path = "../tanki-term" }
tanki-tui = { path = "../tanki-tui" }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
