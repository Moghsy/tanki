[package]
name = "tanki-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anki = { path = "../../vendor/anki/rslib", features = ["rustls"] }
anki_proto = { path = "../../vendor/anki/rslib/proto" }
anki_i18n = { path = "../../vendor/anki/rslib/i18n" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.36", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
toml = "0.9"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
# Custom scheduling JavaScript (PLAN 8.1, Phase 6).
rquickjs = "0.14"
prost-reflect = { version = "0.14", features = ["serde"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
