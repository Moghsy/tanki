[package]
name = "tanki-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# AnkiConnect-compatible HTTP API (PLAN 8.14, Phase 6). Owned by the
# AnkiConnect stream; see docs/implementation/phase-6-interfaces.md.
[dependencies]
tanki-core = { path = "../tanki-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
axum = "0.8"
base64 = "0.22"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
