[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["vendor/anki"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# Versions shared across crates (PLAN 5.1). Streams use `workspace = true`
# for these; new dependencies go in the owning crate's manifest.
[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
# libchafa stays off (PLAN 4.1 prerequisites); image formats are chosen below.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
strip = true

# Anki + optional rich rendering produce many large test executables. Keep
# the ordinary cache small; opt into symbols for a specific debugging session.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
